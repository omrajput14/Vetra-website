name: CI

on:
  push:
    branches: [main, redesign/brand-homepage]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Test, Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run automated test suite
        run: npm test

      - name: Run ESLint check
        run: npm run lint

      - name: Run Next.js production build
        run: npm run build
